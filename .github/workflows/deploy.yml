name: Deploy

# Pull request: check the code and show the Terraform plan.
# Push to main: apply the Terraform, upload the site, clear the CloudFront cache.
# Run workflow (Actions tab): pick a branch in "Use workflow from", then choose an action:
#   Deploy site only               uploads that branch's site and clears the cache. Terraform is not applied.
#   Deploy site and infrastructure applies the Terraform first, then uploads the site.
#   Destroy everything             empties the bucket and runs terraform destroy. Type the bucket name to confirm.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "What should this run do?"
        type: choice
        default: "Deploy site only"
        options:
          - "Deploy site only"
          - "Deploy site and infrastructure"
          - "Destroy everything"
      confirm_bucket:
        description: "Destroy only: type the bucket name to confirm"
        type: string
        required: false

# GitHub gives the job a signed token, and AWS swaps it for temporary credentials.
permissions:
  id-token: write
  contents: read

# Never run two deployments at once.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_bucket_name: ${{ vars.S3_BUCKET }}
  # What this run does. A push always applies the Terraform and uploads the site.
  ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event_name == 'push' && 'Deploy site and infrastructure' || 'Check only') }}
  # OPTIONAL custom domain: uncomment, and add these two repository variables.
  # TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  # TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      # Fail fast, before signing in to AWS, if the destroy was not confirmed.
      - name: Confirm the destroy
        if: env.ACTION == 'Destroy everything'
        env:
          CONFIRM: ${{ inputs.confirm_bucket }}
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          if [ "$CONFIRM" != "$BUCKET" ]; then
            echo "::error::To destroy, type the bucket name ($BUCKET) in 'Destroy only: type the bucket name to confirm'."
            exit 1
          fi

      - name: Sign in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.10"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false

      - name: Terraform apply
        if: env.ACTION == 'Deploy site and infrastructure'
        run: terraform apply -input=false -auto-approve

      - name: Upload the site to S3
        if: env.ACTION == 'Deploy site only' || env.ACTION == 'Deploy site and infrastructure'
        working-directory: .
        run: >
          aws s3 sync . "s3://${{ vars.S3_BUCKET }}" --delete
          --exclude ".git/*" --exclude ".github/*" --exclude ".gitignore"
          --exclude "infra/*" --exclude "docs/*" --exclude "Makefile"
          --exclude "README.md" --exclude "LICENSE"

      - name: Clear the CloudFront cache
        if: env.ACTION == 'Deploy site only' || env.ACTION == 'Deploy site and infrastructure'
        run: >
          aws cloudfront create-invalidation --paths "/*"
          --distribution-id "$(terraform output -raw distribution_id)"

      - name: Show the site URL
        if: env.ACTION == 'Deploy site only' || env.ACTION == 'Deploy site and infrastructure'
        run: |
          {
            echo "### Site deployed"
            echo
            terraform output -raw cloudfront_url
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # The site files were uploaded by the pipeline, not Terraform, so Terraform does not know about
      # them and cannot delete a bucket that still contains them. Empty it first.
      - name: Empty the site bucket
        if: env.ACTION == 'Destroy everything'
        working-directory: .
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3 rm "s3://$BUCKET" --recursive
          else
            echo "Bucket $BUCKET not found, nothing to empty."
          fi

      - name: Terraform destroy
        if: env.ACTION == 'Destroy everything'
        run: terraform destroy -input=false -auto-approve

      - name: Report the destroy
        if: env.ACTION == 'Destroy everything'
        run: |
          {
            echo "### Destroyed"
            echo
            echo "The bucket, the CloudFront distribution and the access control are gone."
            echo "The state bucket and the IAM role are not touched."
          } >> "$GITHUB_STEP_SUMMARY"
